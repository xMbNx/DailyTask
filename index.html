<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Task — Proyectos</title>
<style>
  :root{
    --bg:#e7ebed; --card:#eef1f2; --text:#202e3b; --muted:#647383;
    --border:#d2dadd; --accent:#0097b2; --accent-soft:#dcedf0;
    --danger:#d73349; --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15171c; --card:#1e2128; --text:#e5e7eb; --muted:#9198a8;
      --border:#2c303a; --accent:#3fa3ba; --accent-soft:#1c343a;
      --danger:#f87171;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15171c; --card:#1e2128; --text:#e5e7eb; --muted:#9198a8;
    --border:#2c303a; --accent:#3fa3ba; --accent-soft:#1c343a;
    --danger:#f87171;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    padding:32px 16px 60px;
  }
  .wrap{max-width:900px; margin:0 auto;}
  .hero-actions{display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:4px;}
  .hero{display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; margin-bottom:32px;}
  .hero h1{font-size:1.6rem; margin:0; position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}
  .logo{
    width:auto; height:88px; max-width:280px; flex-shrink:0; object-fit:contain;
    border-radius:14px;
  }
  button{
    font:inherit; cursor:pointer; border:none; border-radius:10px; padding:10px 16px;
    background:var(--accent); color:#fff; font-size:.85rem; font-weight:600;
  }
  button.ghost{background:transparent; color:var(--text); border:1px solid var(--border);}
  button.icon{background:transparent; color:var(--muted); padding:6px 8px; border-radius:8px;}
  button.icon:hover{background:var(--accent-soft); color:var(--danger);}
  button:disabled{opacity:.5; cursor:not-allowed;}

  .banner{
    background:var(--accent-soft); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:22px; font-size:.85rem; display:flex; align-items:center;
    gap:12px; flex-wrap:wrap;
  }
  .banner .note{color:var(--muted); flex:1; min-width:220px;}

  .grid{display:flex; flex-direction:column; gap:14px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px 16px; display:flex; align-items:center; gap:14px;
    border-left:4px solid var(--dot, var(--accent));
    text-decoration:none; color:inherit; transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.08);}
  .card .name{font-weight:700; font-size:1rem; word-break:break-word; flex:0 0 auto; min-width:100px; max-width:200px;}
  .card .no-data{color:var(--muted); font-size:.8rem; font-style:italic; flex:1;}
  .card .actions{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .card .del-wrap{
    background:var(--danger); border-radius:8px; display:flex; align-items:center; justify-content:center;
  }
  .card .del-wrap .icon{color:#fff; padding:6px 8px;}
  .card .del-wrap .icon:hover{background:rgba(255,255,255,.2); color:#fff;}

  .mini-overview{display:flex; gap:8px; flex:1; min-width:0;}
  .mini-item{
    background:var(--bg); border:1px solid var(--border); border-radius:10px;
    padding:7px 10px; display:flex; align-items:center; justify-content:center; gap:8px; min-width:0; flex:1;
  }
  .mini-icon{
    display:grid; place-items:center; width:26px; height:26px; border-radius:8px;
    background:var(--accent-soft); color:var(--accent); font-size:13px; flex-shrink:0;
  }
  .mini-value{font-size:1rem; font-weight:700; letter-spacing:-.5px; line-height:1.2; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .mini-label{color:var(--muted); font-size:.62rem; white-space:nowrap;}
  @media(max-width:760px){
    .card{flex-wrap:wrap;}
    .mini-overview{flex-wrap:wrap;}
    .mini-item{flex:1 1 calc(50% - 10px);}
  }

  .new-card{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:transparent; border:2px dashed var(--border); border-radius:var(--radius);
    color:var(--muted); font-weight:600; min-height:60px; padding:16px; width:100%;
  }
  .new-card:hover{border-color:var(--accent); color:var(--accent);}

  .empty{color:var(--muted); font-size:.9rem; padding:20px 0;}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center;
    justify-content:center; z-index:50;
  }
  .modal{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px; width:min(360px, 90vw); display:flex; flex-direction:column; gap:12px;
  }
  .modal h2{margin:0; font-size:1.05rem;}
  .modal input{
    font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--border);
    background:var(--bg); color:var(--text);
  }
  .modal .err{color:var(--danger); font-size:.8rem; min-height:1em;}
  .modal .actions{display:flex; justify-content:flex-end; gap:8px;}
  .hidden{display:none !important;}

  .hero-actions button{font-size:.82rem;}
</style>
</head>

    <h2>Nuevo proyecto</h2>
    <input id="newNameInput" type="text" placeholder="Nombre del proyecto" maxlength="60">
    <div id="newNameErr" class="err"></div>
    <div class="actions">
      <button id="cancelNewBtn" class="ghost">Cancelar</button>
      <button id="confirmNewBtn">Crear</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  const fsSupported = 'showDirectoryPicker' in window;
  const DB_NAME = 'tareas-projects-db', STORE = 'handles';
  const PALETTE = [
    '#0097b2','#065f73','#0e7490','#06b6d4','#0d9488','#134e4a','#d97757','#c2632f',
    '#dc2626','#e11d48','#db2777','#c026d3','#9333ea','#7c3aed','#4f46e5','#2563eb',
    '#0284c7','#16a34a','#65a30d','#ca8a04','#f59e0b','#ea580c','#92400e','#57534e'
  ];

  let dirHandle = null;
  let lastProjects = [];

  /* ---------- IndexedDB (stores the directory handle) ---------- */
  function idbOpen(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbGet(key){
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const rq = tx.objectStore(STORE).get(key);
      rq.onsuccess = () => resolve(rq.result);
      rq.onerror = () => reject(rq.error);
    });
  }
  async function idbSet(key, val){
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(val, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  /* ---------- theme (shared with the projects) ---------- */
  const THEME_KEY = 'tareas-view-theme';
  const themeToggleBtn = document.getElementById('themeToggleBtn');
  function getSystemTheme(){
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function applyTheme(stored){
    if(stored){ document.documentElement.setAttribute('data-theme', stored); }
    else{ document.documentElement.removeAttribute('data-theme'); }
    const effective = stored || getSystemTheme();
    themeToggleBtn.textContent = effective === 'dark' ? '☀ Modo claro' : '◐ Modo oscuro';
  }
  themeToggleBtn.addEventListener('click', () => {
    const stored = localStorage.getItem(THEME_KEY);
    const effective = stored || getSystemTheme();
    const next = effective === 'dark' ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  });
  applyTheme(localStorage.getItem(THEME_KEY));

  /* ---------- helpers ---------- */
  function colorFor(name){
    let h = 0;
    for(let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }
  function slugify(name){
    return name
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .slice(0, 50);
  }
  function extractTitle(html, fallback){
    const m = html.match(/<title>([^<]*)<\/title>/i);
    const t = m ? m[1].trim() : '';
    return t && t.toLowerCase() !== 'daily task' ? t : fallback;
  }

  // Every project page shares this same origin, so its saved board is readable
  // straight out of localStorage under its own namespaced key (see LS_KEY in
  // dailytask.html) — no need to open the project's data file to summarize it.
  function readProjectStats(fileName){
    const slug = fileName.replace(/\.html?$/i, '');
    let raw;
    try{ raw = localStorage.getItem('tareas-app-v2:' + slug); }catch(e){ return null; }
    if(!raw) return null;
    let data;
    try{ data = JSON.parse(raw); }catch(e){ return null; }
    const categories = Array.isArray(data && data.categories) ? data.categories : [];
    if(categories.length === 0) return null;

    let total = 0, done = 0, weightedTotal = 0, weightedDone = 0;
    categories.forEach(cat => {
      const tasks = Array.isArray(cat.tasks) ? cat.tasks : [];
      total += tasks.length;
      done += tasks.filter(t => t.done).length;
      tasks.forEach(t => {
        const subtasks = Array.isArray(t.subtasks) ? t.subtasks : [];
        if(subtasks.length > 0){
          weightedTotal += subtasks.length;
          weightedDone += subtasks.filter(s => s.done).length;
        } else {
          weightedTotal += 1;
          weightedDone += t.done ? 1 : 0;
        }
      });
    });

    return {
      categories: categories.length,
      pending: total - done,
      done,
      progress: total ? Math.round(done / total * 100) : 0,
      totalProgress: weightedTotal ? Math.round(weightedDone / weightedTotal * 100) : 0
    };
  }

  /* ---------- rendering ---------- */
  function renderBanner(kind){
    const el = document.getElementById('banner');
    if(kind === 'nosupport'){
      el.innerHTML = `<div class="banner"><span class="note">Tu navegador no permite gestionar archivos de una carpeta (usa Chrome o Edge para esta página). Abre tus proyectos directamente desde sus archivos .html.</span></div>`;
      return;
    }
    if(kind === 'reconnect'){
      el.innerHTML = `<div class="banner"><span class="note">Se necesita permiso de nuevo para acceder a la carpeta de proyectos.</span><button id="reconnectBtn">Reconectar</button></div>`;
      document.getElementById('reconnectBtn').addEventListener('click', reconnectDir);
      return;
    }
    if(kind === 'setup'){
      el.innerHTML = `<div class="banner"><span class="note">Elige la carpeta donde están tus archivos de proyecto (por ejemplo, esta misma carpeta <b>DailyTask</b>) para ver el listado y poder crear o eliminar proyectos.</span><button id="chooseDirBtn">Elegir carpeta</button></div>`;
      document.getElementById('chooseDirBtn').addEventListener('click', chooseDir);
      return;
    }
    el.innerHTML = '';
  }

  function renderGrid(projects){
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    for(const p of projects){
      const stats = readProjectStats(p.file);
      const statsHtml = stats ? `
        <div class="mini-overview">
          <div class="mini-item"><span class="mini-icon" aria-hidden="true">☷</span><div><div class="mini-value">${stats.pending}</div><div class="mini-label">Pendientes</div></div></div>
          <div class="mini-item"><span class="mini-icon" aria-hidden="true">✓</span><div><div class="mini-value">${stats.done}</div><div class="mini-label">Completadas</div></div></div>
          <div class="mini-item"><span class="mini-icon" aria-hidden="true">◷</span><div><div class="mini-value">${stats.progress}%</div><div class="mini-label">Progreso</div></div></div>
          <div class="mini-item"><span class="mini-icon" aria-hidden="true">⚖</span><div><div class="mini-value">${stats.totalProgress}%</div><div class="mini-label">Progreso total</div></div></div>
        </div>
      ` : `<div class="no-data">Sin datos guardados todavía</div>`;

      const a = document.createElement('a');
      a.className = 'card';
      a.href = p.file;
      a.style.setProperty('--dot', colorFor(p.name));
      a.innerHTML = `
        <div class="name">${escapeHtml(p.name)}</div>
        ${statsHtml}
        <div class="actions">
          <button class="icon edit" title="Editar nombre">✎</button>
          <div class="del-wrap"><button class="icon del" title="Eliminar proyecto">✕</button></div>
        </div>
      `;
      a.querySelector('.edit').addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        editProjectName(p.file, p.name);
      });
      a.querySelector('.del').addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        deleteProject(p.file, p.name);
      });
      grid.appendChild(a);
    }

    const newCard = document.createElement('button');
    newCard.className = 'new-card';
    newCard.textContent = '+ Nuevo proyecto';
    newCard.disabled = !dirHandle;
    newCard.addEventListener('click', openNewProjectModal);
    grid.appendChild(newCard);

    if(projects.length === 0 && dirHandle){
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No se han encontrado proyectos (.html) en la carpeta elegida.';
      grid.prepend(empty);
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  /* ---------- scanning the directory ---------- */
  async function scanProjects(){
    const projects = [];
    for await (const [name, handle] of dirHandle.entries()){
      if(handle.kind !== 'file') continue;
      if(!/\.html?$/i.test(name)) continue;
      if(name.toLowerCase() === 'index.html') continue;
      let title = name.replace(/\.html?$/i, '');
      try{
        const file = await handle.getFile();
        const text = await file.text();
        title = extractTitle(text, title);
      }catch(e){ /* keep filename fallback */ }
      projects.push({ name: title, file: name });
    }
    projects.sort((a, b) => a.name.localeCompare(b.name, 'es'));
    lastProjects = projects;
    renderGrid(projects);
  }

  /* ---------- directory linking ---------- */
  async function chooseDir(){
    try{
      const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
      dirHandle = handle;
      await idbSet('projectsDir', handle);
      renderBanner('none');
      await scanProjects();
    }catch(e){ /* user cancelled */ }
  }

  async function reconnectDir(){
    try{
      const perm = await dirHandle.requestPermission({ mode: 'readwrite' });
      if(perm === 'granted'){
        renderBanner('none');
        await scanProjects();
      }
    }catch(e){ console.warn(e); }
  }

  async function initPersistence(){
    if(!fsSupported){
      renderBanner('nosupport');
      renderGrid([]);
      return;
    }
    try{
      const h = await idbGet('projectsDir');
      if(h){
        dirHandle = h;
        const perm = await dirHandle.queryPermission({ mode: 'readwrite' });
        if(perm === 'granted'){
          renderBanner('none');
          await scanProjects();
          return;
        }
        renderBanner('reconnect');
        renderGrid([]);
        return;
      }
    }catch(e){ console.warn(e); }
    renderBanner('setup');
    renderGrid([]);
  }

  async function getTemplateHandle(){
    try{ return await dirHandle.getFileHandle('dailytask.html'); }catch(e){ /* fall through */ }
    for(const p of lastProjects){
      try{ return await dirHandle.getFileHandle(p.file); }catch(e){ /* try next */ }
    }
    return null;
  }

  /* ---------- create project ---------- */
  const modalBackdrop = document.getElementById('modalBackdrop');
  const newNameInput = document.getElementById('newNameInput');
  const newNameErr = document.getElementById('newNameErr');

  function openNewProjectModal(){
    newNameInput.value = '';
    newNameErr.textContent = '';
    modalBackdrop.classList.remove('hidden');
    newNameInput.focus();
  }
  function closeNewProjectModal(){
    modalBackdrop.classList.add('hidden');
  }
  document.getElementById('cancelNewBtn').addEventListener('click', closeNewProjectModal);
  modalBackdrop.addEventListener('click', (e) => { if(e.target === modalBackdrop) closeNewProjectModal(); });
  newNameInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') createProject(); });
  document.getElementById('confirmNewBtn').addEventListener('click', createProject);

  async function createProject(){
    const name = newNameInput.value.trim();
    if(!name){ newNameErr.textContent = 'Escribe un nombre.'; return; }
    const slug = slugify(name);
    if(!slug || slug === 'index'){ newNameErr.textContent = 'Nombre no válido, prueba con otro.'; return; }
    const fileName = slug + '.html';

    try{
      let exists = true;
      try{ await dirHandle.getFileHandle(fileName); }catch(e){ exists = false; }
      if(exists){ newNameErr.textContent = 'Ya existe un proyecto con ese nombre.'; return; }

      const templateHandle = await getTemplateHandle();
      if(!templateHandle) throw new Error('No hay ninguna plantilla .html disponible en la carpeta.');
      const templateFile = await templateHandle.getFile();
      let template = await templateFile.text();
      template = template.replace(/<title>[^<]*<\/title>/i, `<title>${escapeHtml(name)}</title>`);

      const fileHandle = await dirHandle.getFileHandle(fileName, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(template);
      await writable.close();

      closeNewProjectModal();
      await scanProjects();
    }catch(e){
      console.error(e);
      newNameErr.textContent = e && e.message ? e.message : 'No se pudo crear el proyecto.';
    }
  }

  /* ---------- edit project name ---------- */
  async function editProjectName(fileName, currentName){
    const input = prompt('Nuevo nombre del proyecto:', currentName);
    if(input === null) return;
    const trimmed = input.trim();
    if(!trimmed || trimmed === currentName) return;
    try{
      const handle = await dirHandle.getFileHandle(fileName);
      const file = await handle.getFile();
      let text = await file.text();
      text = text.replace(/<title>[^<]*<\/title>/i, `<title>${escapeHtml(trimmed)}</title>`);
      const writable = await handle.createWritable();
      await writable.write(text);
      await writable.close();
      await scanProjects();
    }catch(e){
      console.error(e);
      alert('No se pudo renombrar el proyecto.');
    }
  }

  /* ---------- delete project ---------- */
  async function deleteProject(fileName, name){
    const ok = confirm(`¿Eliminar el proyecto "${name}"?\n\nSe borrará el archivo "${fileName}" de la carpeta. Esta acción no se puede deshacer.\n\n(Su archivo de datos .json, si existe con ese mismo nombre, no se borra automáticamente.)`);
    if(!ok) return;
    try{
      await dirHandle.removeEntry(fileName);
      await scanProjects();
    }catch(e){
      console.error(e);
      alert('No se pudo eliminar el archivo. Comprueba que no esté abierto en otra pestaña.');
    }
  }

  initPersistence();
})();
</script>
</body>
</html>
